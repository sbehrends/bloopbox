name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same gate before it packages anything.
  workflow_call:
    inputs:
      gate_only:
        description: 'Skip the packaging job — the caller does its own'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here pushes, comments or publishes; a job that ever needs more asks
# for it by name, as release.yml's publishing job does.
#
# Every third-party action below is pinned to a commit, with the tag it was in a comment. A tag can
# be moved by whoever controls the action's repository, and these steps run with the job's token.
# Nothing bumps them automatically: Dependabot is off, so a bump is a deliberate commit.
permissions:
  contents: read

jobs:
  # Which parts of the monorepo this push actually touched. Cheap (a few seconds), and it is what
  # keeps a docs-only or website-only change from spending twelve minutes emulating arm64.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API, and a pull request's token can
    # read nothing it is not granted here — a fork's or a bot's least of all. Without this the job
    # fails with "Resource not accessible by integration" and every gated job is skipped.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      box: ${{ steps.decide.outputs.box }}
      web: ${{ steps.decide.outputs.web }}
      docs: ${{ steps.decide.outputs.docs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Only meaningful where there is a diff to compare against. A tag, a manual dispatch or a
      # call from release.yml has none, and the step is skipped — handled below.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        with:
          filters: |
            box:
              - 'box/software/**'
              - '.github/workflows/**'
              - '.githooks/**'
            web:
              - 'website/**'
              - '.github/workflows/**'
            docs:
              - '**/*.md'

      # The manual's download button links to the release named by website/package.json's
      # version, and the release's files are named from box/software's. Checked here, the one job
      # every run has, rather than in either package's job, which a one-sided bump would skip.
      - name: Site and box versions match
        run: |
          set -euo pipefail
          site="$(node -p "require('./website/package.json').version")"
          box="$(node -p "require('./box/software/package.json').version")"
          if [[ "${site}" != "${box}" ]]; then
            echo "::error::website/package.json is ${site} but box/software/package.json is ${box}; the manual's download link would point at the wrong release"
            exit 1
          fi

      # Fail-safe on purpose: an empty output means the filter did not run, and the right answer to
      # "I do not know what changed" is to run everything. That is what keeps a tag release from
      # silently skipping its own gate.
      - id: decide
        env:
          FILTER_BOX: ${{ steps.filter.outputs.box }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_DOCS: ${{ steps.filter.outputs.docs }}
          GATE_ONLY: ${{ inputs.gate_only }}
        run: |
          set -euo pipefail
          box="${FILTER_BOX:-true}"
          web="${FILTER_WEB:-true}"
          docs="${FILTER_DOCS:-true}"
          # Called by release.yml: this is a tag being packaged, so nothing may be skipped.
          if [[ "${GATE_ONLY}" == "true" ]]; then box=true; web=true; docs=true; fi
          {
            echo "box=${box}"
            echo "web=${web}"
            echo "docs=${docs}"
          } >> "$GITHUB_OUTPUT"
          printf 'box=%s web=%s docs=%s\n' "${box}" "${web}" "${docs}"

  box-gate:
    name: box gate (format, lint, typecheck, test)
    needs: changes
    if: needs.changes.outputs.box == 'true'
    runs-on: ubuntu-latest
    # Monorepo: every `run` step below is the box software's, so point them all at it once.
    # `uses` steps are unaffected by this and pass paths explicitly.
    defaults:
      run:
        working-directory: box/software
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Matches packaging/versions.env, so what CI validates is what the device runs.
          node-version: '24.18.1'
          cache: npm
          # `defaults.run` does not reach an action's inputs, so the lockfile is named here.
          cache-dependency-path: box/software/package-lock.json

      # The Opus pipeline, and `npm run sounds` synthesises the cue WAVs through it. Without
      # this, generate-sounds fails and every audio test has nothing to play.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci

      # What ships to the device, at high and above. Dev tooling is excluded: it never leaves the
      # build machine, and an advisory in a test runner is not a reason to block a fix.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Not committed — src/audio/sounds/*.wav is generated. Must run before the gate.
      - run: npm run sounds

      - name: npm run doctor
        run: npm run doctor

      - name: npm run check
        run: npm run check

  box-package:
    name: package arm64 release
    # Proves on every box change that the thing which actually ships still builds: the native
    # opengpio addon, the bundled runtime, and the installer running on a bare Trixie.
    #
    # Skipped when release.yml calls this workflow for the gate, or the emulated arm64 build
    # would run twice per release.
    needs: changes
    if: needs.changes.outputs.box == 'true' && !inputs.gate_only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box/software
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Exports ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL, which `--cache-to type=gha` needs and
      # which a raw `docker buildx build` (as opposed to docker/build-push-action) does not get.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Build the release tarball
        env:
          # The expensive layer under emulation is `npm ci` plus compiling opengpio, and
          # Dockerfile.release already isolates it above `COPY . .` — so it only genuinely
          # changes when package-lock.json does. mode=min keeps the large arm64 node_modules
          # layer out of the cache; GitHub allows 10 GB per repository.
          #
          # UNVERIFIED: this has not yet run on a real GitHub runner. A cache miss is not an
          # error, so the worst case is the build being as slow as it was before. If it fails
          # outright, delete this env block — build-release.sh works without it.
          BUILDX_EXTRA_ARGS: --cache-from type=gha --cache-to type=gha,mode=min
        run: ./scripts/build-release.sh

      - name: Smoke test it on bare Debian Trixie arm64
        run: ./scripts/smoke-test-release.sh

      # First-boot onboarding end to end against the same tarball: hotspot, portal, scan, join.
      # Only the radio is faked (packaging/fake-nmcli.sh).
      - name: Onboarding test
        run: ./scripts/test-onboarding.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bloopbox-release
          # Action input, so not covered by `defaults.run.working-directory` above.
          path: |
            box/software/release/*.tar.gz
            box/software/release/*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  # The onboarding test runs the agent in a container with no systemd, so no sandbox — which is how
  # the agent shipped unable to clear its own requests under ProtectSystem=strict (review 0.8). This
  # runs it under bloopbox-net.service's own [Service] properties, on a runner that has systemd.
  net-agent-sandbox:
    name: net agent under its systemd sandbox
    needs: changes
    if: needs.changes.outputs.box == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box/software
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.1'

      # sudo resets PATH, and the agent parses requests with the node setup-node just installed.
      - run: sudo env "PATH=${PATH}" ./scripts/test-net-agent-sandbox.sh

  # Neither prettier nor oxlint reads shell, and a third of the box is shell. The pre-commit hook
  # runs ShellCheck only where it happens to be installed and only over staged files; this is the
  # complete pass. Same severity as the hook.
  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.box == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: ShellCheck every tracked shell script
        run: |
          set -euo pipefail
          # By shebang as well as extension: .githooks/ holds scripts with no `.sh`. A regex on the
          # captured first line, not `head | grep -q` (the SIGPIPE tripwire in CLAUDE.md).
          shebang='^#!.*(/|env )(ba)?sh( |$)'
          scripts=()
          while IFS= read -r -d '' file; do
            first="$(head -n1 -- "${file}")"
            if [[ "${file}" == *.sh || "${first}" =~ ${shebang} ]]; then
              scripts+=("${file}")
            fi
          done < <(git ls-files -z -- '*.sh' .githooks box/software/deploy box/software/packaging)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          shellcheck --version | head -2
          shellcheck --severity=warning "${scripts[@]}"

  website:
    name: website (typecheck, static export)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Its own package, its own lockfile, its own node_modules — there are no npm workspaces at
    # the root, deliberately (see website/README.md).
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # `next build` typechecks as well, but running tsc first fails in ten seconds instead of
      # after a full compile, and it is what a developer runs locally.
      - run: npm run check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bloopbox-website
          path: website/out
          retention-days: 14
          if-no-files-found: error

  docs-links:
    name: docs links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Python stdlib only and no npm install, so this stays a ten-second job on a docs-only push.
      - run: .github/scripts/check-doc-links.py

  # The single required status check. Point branch protection at THIS job, not at the ones above.
  #
  # A job skipped by `if:` reports as skipped, which branch protection accepts — whereas filtering
  # the workflow itself with `on: push: paths:` would mean a required check never reports at all,
  # leaving the PR blocked forever. One stable check name, whatever the filter decided.
  ci:
    name: ci
    needs: [changes, box-gate, box-package, net-agent-sandbox, shellcheck, website, docs-links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify nothing failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          printf 'job results: %s\n' "${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::a required job reported '${result}'"; exit 1 ;;
            esac
          done
          echo "ci ok"

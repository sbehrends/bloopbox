name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Also build the flashable SD card image (adds ~15 min)'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the job that publishes the release asks for `contents: write`. Actions
# are pinned to commits for the reason given in ci.yml.
permissions:
  contents: read

jobs:
  # The same gate as every push. A tag that cannot pass it must not become a release.
  # gate_only, because the packaging job below is this workflow's own.
  #
  # Deliberately NOT path-filtered, unlike ci.yml's own triggers: a tag has to rebuild and revalidate
  # everything regardless of what its diff touched. `gate_only: true` is also what tells ci.yml's
  # `changes` job to stop filtering — see the fail-safe there. Do not "optimize" this by adding a
  # filter, or a release will eventually ship an artefact nothing validated.
  check:
    uses: ./.github/workflows/ci.yml
    with:
      gate_only: true

  package:
    name: package arm64 release
    needs: check
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    # The release scripts derive their own root from their location, so running them from
    # box/software is all it takes — `release/` resolves under it.
    defaults:
      run:
        working-directory: box/software
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.1'

      # GitHub's hosted runners are x86, so the arm64 build runs under emulation. Swapping
      # runs-on for an arm64 runner makes this several times faster and needs no other change.
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the release tarball
        id: build
        run: |
          ./scripts/build-release.sh
          echo "artifact=$(basename "$(ls release/*.tar.gz)")" >> "$GITHUB_OUTPUT"

      - name: Smoke test it on bare Debian Trixie arm64
        run: ./scripts/smoke-test-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          # Action input, so not covered by `defaults.run.working-directory`.
          path: |
            box/software/release/*.tar.gz
            box/software/release/*.tar.gz.sha256
          if-no-files-found: error

  image:
    name: build SD card image
    needs: package
    if: github.event_name == 'push' || inputs.build_image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box/software
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          # Must land where build-sd-image.sh looks for it: <its own root>/release.
          path: box/software/release

      - name: Refuse to publish a Wi-Fi passphrase
        # CI images are published, so the build step below takes no network. A WIFI_PSK secret
        # left over from when it did must fail loudly rather than be silently ignored, so
        # whoever set it learns why it no longer applies.
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
        run: |
          if [[ -n "${WIFI_PSK}" ]]; then
            echo "::error::a WIFI_PSK secret is set, and CI images are published — delete the secret; see docs/deployment.md"
            exit 1
          fi
          if [[ -n "${WIFI_SSID}" ]]; then
            echo "::warning::the WIFI_SSID secret is no longer used by CI images and can be deleted"
          fi

      - name: Install image build tools
        run: |
          sudo apt-get update -qq
          # qemu-user-static + binfmt-support let the x86 runner chroot into the arm64
          # image; zerofree makes the compressed result much smaller.
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support parted e2fsprogs dosfstools xz-utils zerofree

      - name: Build the image
        # /mnt is the runner's large scratch disk — the uncompressed image is several GB.
        run: |
          sudo ./scripts/build-sd-image.sh \
            --work-dir /mnt/bloopbox-image \
            --output "release/$(basename "$(ls release/*.tar.gz)" .tar.gz | sed 's/-linux-arm64//')-sd.img.xz" \
            ${WIFI_COUNTRY:+--wifi-country "$WIFI_COUNTRY"} \
            ${IMAGE_PASSWORD:+--password "$IMAGE_PASSWORD"}
        env:
          # Both optional. Without IMAGE_PASSWORD each device generates its own ssh password
          # on first boot and shows it in the admin panel; with it, every card flashed from
          # this image shares that one, which is only for debugging before the panel is up.
          #
          # There is deliberately no Wi-Fi network here. This image is published, and a
          # passphrase baked into it would be readable by anyone who downloads it: a parent
          # fills in bloopbox-wifi.txt on the boot partition, or joins through the hotspot.
          # Bake a network in with a local build (docs/deployment.md) instead.
          WIFI_COUNTRY: ${{ secrets.WIFI_COUNTRY }}
          IMAGE_PASSWORD: ${{ secrets.IMAGE_PASSWORD }}

      - name: Fix ownership of the outputs
        run: sudo chown -R "$(id -u):$(id -g)" release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sd-card-image
          path: |
            box/software/release/*.img.xz
            box/software/release/*.img.xz.sha256
          if-no-files-found: error

      # No credentials artifact: on a public repository every signed-in GitHub user can download
      # a workflow's artifacts, so "kept out of the release" was never private. Nothing in the
      # image needs one now — each device shows its own password in the admin panel.

  release:
    name: attach to the GitHub release
    needs: [package, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Deliberately NOT working-directory'd into box/software: this job runs no build script,
    # it only downloads artifacts and hands them to `gh`. Its `release/` is a scratch dir at
    # the runner root, self-consistent with the globs below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-tarball
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sd-card-image
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Explicit asset list: credentials.txt must never be published, and a glob would
          # eventually pick it up.
          assets=()
          for pattern in 'release/*.tar.gz' 'release/*.tar.gz.sha256' \
                         'release/*.img.xz' 'release/*.img.xz.sha256'; do
            for file in $pattern; do
              # An `if`, not `[[ ... ]] && ...`: an unmatched glob makes that a failing
              # command and `set -e` would abort the whole step.
              if [[ -f "$file" ]]; then assets+=("$file"); fi
            done
          done
          [[ "${#assets[@]}" -gt 0 ]] || { echo "no release assets were produced" >&2; exit 1; }
          printf 'attaching:\n'; printf '  %s\n' "${assets[@]}"

          notes=$(cat <<'EOF'
          Install on a Raspberry Pi Zero 2 W running Raspberry Pi OS Trixie (64-bit):

          ```
          tar xzf bloopbox-*-linux-arm64.tar.gz
          sudo ./bloopbox-*-linux-arm64/install.sh
          ```

          Or flash the `-sd.img.xz` for a card that needs no install step. See
          `docs/deployment.md`. Each device makes its own ssh password on first
          boot; the admin panel shows it under Advanced → SSH access.
          EOF
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "${GITHUB_REF_NAME}" --notes "${notes}"
          fi

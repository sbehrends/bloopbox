    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131a2c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../shared/bloopbox-favicon.svg" />

    <main class="shell">
      <header class="page-head">
        <h1 class="lockup">
          <img
            class="lockup-mark"
            src="../shared/bloopbox-iso-light.svg"
            alt=""
            width="40"
            height="40"
          />
          <span class="lockup-word">bloopbox</span>
          <span class="lockup-tag">Settings</span>

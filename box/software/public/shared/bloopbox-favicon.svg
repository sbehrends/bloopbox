<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="bloopbox">
  <title>bloopbox</title>
  <!--
    The favicon, and the only place a second drawing of the mark is allowed.

    Not a variant of bloopbox-mark.svg — a different job. The full mark is three concentric ring
    pairs, and below about 24px the rings, the bands and the holes all collapse into one blur.
    This keeps what survives at 16px: the three buttons in their own order, and the bubble tail
    that makes the silhouette a message rather than three dots. Solid discs, no holes, one
    hairline.

    If the mark's colours or button order change, change them here too.
  -->
  <g stroke="#1a2b48" stroke-width="2.6" stroke-linejoin="round">
    <path fill="#f7b733" d="M11 30 L11.5 55 Q11.8 58 15 56 L31 42 Q34 38.5 27 33 Z" />
    <circle cx="15.5" cy="26" r="10.5" fill="#f7b733" />
    <circle cx="32" cy="26" r="10.5" fill="#ff6f61" />
    <circle cx="48.5" cy="26" r="10.5" fill="#00a7e1" />
  </g>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulator — bloopbox</title>
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131a2c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../shared/bloopbox-favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./simulator.css" />
  </head>
  <body>
    <main class="shell">
      <header class="page-head">
        <h1 class="lockup">
          <img
            class="lockup-mark"
            src="../shared/bloopbox-mark.svg"
            alt=""
            width="40"
            height="40"
          />
          <span class="lockup-word">bloopbox</span>
          <span class="lockup-tag">Simulator</span>
        </h1>
        <p class="status" id="status">Connecting…</p>
      </header>

      <!-- Buttons 1/2/3 render left/centre/right, matching the physical layout. -->
      <canvas
        id="device"
        class="device-canvas"
        width="720"
        height="380"
        aria-label="Virtual device"
      ></canvas>

      <p class="hint">
        Click and <strong>hold</strong> a button to record, or tap it to play what arrived. Keys
        <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> work too — hold <kbd>1</kbd>+<kbd>3</kbd> for three
        seconds to toggle silent mode.
      </p>

      <section class="injector">
        <h2>Event injector</h2>
        <div class="injector-buttons" id="injector"></div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
